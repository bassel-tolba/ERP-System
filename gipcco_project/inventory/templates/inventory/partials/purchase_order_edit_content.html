<!-- gipcco_project/inventory/templates/inventory/partials/purchase_order_edit_content.html -->

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0" style="font-weight: 700;">تعديل أمر شراء: {{ po.po_number }}</h1>
    <a href="{% url 'inventory:view_purchase_order' pk=po.id %}" class="btn btn-outline-secondary">
        <i class="bi bi-x-lg"></i> إلغاء التعديل
    </a>
</div>

<form method="post" action="{% url 'inventory:edit_purchase_order' pk=po.id %}">
    {% csrf_token %}
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">بيانات أمر الشراء الأساسية</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="po_number" class="form-label fw-bold">رقم أمر الشراء</label>
                    <input type="text" class="form-control" id="po_number" name="po_number" required value="{{ po.po_number }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="supplier_id" class="form-label fw-bold">المورد</label>
                    <select class="form-select searchable-select" id="supplier_id" name="supplier_id" required>
                        <option value="">اختر مورد...</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}" {% if supplier.id == po.supplier.id %}selected{% endif %}>{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="order_date" class="form-label fw-bold">تاريخ الطلب</label>
                    <input type="text" class="form-control datepicker" id="order_date" name="order_date" required value="{{ po.order_date|date:'Y-m-d' }}">
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">بنود أمر الشراء</h5>
            <div>
                <span class="badge bg-secondary me-2" id="allocation-total-badge">إجمالي التوزيع: 0.00%</span>
                <button type="button" class="btn btn-success" id="add-item-btn"><i class="bi bi-plus-lg"></i> إضافة بند</button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table">
                        <tr>
                            <th class="ps-3" style="width: 20%;">المنتج</th>
                            <th class="text-center" style="width: 8%;">الكمية</th>
                            <th class="text-center" style="width: 10%;">السعر الأساسي</th>
                            <th class="text-center" style="width: 8%;">ضريبة ق.م (%)</th>
                            <th class="text-center" style="width: 8%;">خصم منبع (%)</th>
                            <th style="width: 20%;">تقدير تكاليف الشحن</th>
                            <th class="text-center" style="width: 10%;">الإجمالي التقديري</th>
                            <th class="text-center" style="width: 10%;">الصافي للمورد</th>
                            <th class="text-center pe-3" style="width: 6%;">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="po-items-tbody">
                        <!-- JS will populate this -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="mt-4 text-center">
        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2-circle"></i> حفظ التعديلات</button>
    </div>
</form>
