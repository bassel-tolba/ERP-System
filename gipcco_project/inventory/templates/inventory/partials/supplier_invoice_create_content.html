<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2"><i class="bi bi-file-earmark-plus-fill me-2"></i>إنشاء فاتورة مورد جديدة</h1>
</div>

<form method="post" id="createSupplierInvoiceForm">
  {% csrf_token %}
  <input type="hidden" name="source_type" id="source_type" value="receipts">
  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="invoice-source-tabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="receipts-tab" data-bs-toggle="tab" data-bs-target="#receipts-panel" type="button" role="tab" aria-controls="receipts-panel" aria-selected="true" data-source="receipts">
                <i class="bi bi-box-seam me-1"></i>إيصالات الاستلام
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="expenses-tab" data-bs-toggle="tab" data-bs-target="#expenses-panel" type="button" role="tab" aria-controls="expenses-panel" aria-selected="false" data-source="expenses">
                <i class="bi bi-wallet2 me-1"></i>المصروفات المعتمدة
              </button>
            </li>
          </ul>
        </div>
        <div class="card-body">
            <div class="mb-3">
              <label for="supplier" class="form-label">اختر المورد لعرض البنود</label>
              <select name="supplier" id="supplier" class="form-select searchable-select" required>
                <option value="">--- اختر مورد ---</option>
                {% for s in suppliers %}
                  <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="tab-content" id="invoice-source-tab-content">
              <!-- Receipts Panel -->
              <div class="tab-pane fade show active" id="receipts-panel" role="tabpanel" aria-labelledby="receipts-tab">
                <div class="table-responsive">
                  <table class="table table-sm">
                    <thead>
                      <tr>
                        <th style="width: 5%;"><input class="form-check-input" type="checkbox" id="select-all-items" title="تحديد الكل"></th>
                        <th>تاريخ الإفراج</th>
                        <th>رقم الفحص</th>
                        <th>المنتج</th>
                        <th>الكمية</th>
                        <th class="text-end">القيمة</th>
                      </tr>
                    </thead>
                    <tbody id="items-table-body">
                      <!-- JS will populate this -->
                    </tbody>
                  </table>
                </div>
              </div>
              <!-- Expenses Panel (Initially empty structure) -->
              <div class="tab-pane fade" id="expenses-panel" role="tabpanel" aria-labelledby="expenses-tab">
                <!-- The same table structure will be used, but JS will populate it with different headers and data -->
              </div>
            </div>

            <div id="no-items-row" class="text-center py-3 text-muted">
              يرجى اختيار مورد لعرض البنود المتاحة.
            </div>
            <div id="items-loading" class="d-none text-center py-3">
              <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <span class="ms-2">جاري تحميل البنود...</span>
            </div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="card-title mb-0">بيانات الفاتورة</h5>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label for="invoice_number" class="form-label">رقم فاتورة المورد</label>
            <input type="text" class="form-control" id="invoice_number" name="invoice_number" required>
          </div>
          <div class="mb-3">
            <label for="invoice_date" class="form-label">تاريخ الفاتورة</label>
            <input type="date" class="form-control" id="invoice_date" name="invoice_date" value="{{ today_date }}" required>
          </div>
          <div class="mb-3">
            <label for="due_date" class="form-label">تاريخ الاستحقاق</label>
            <input type="date" class="form-control" id="due_date" name="due_date" value="{{ today_date }}" required>
          </div>
          <hr>
          <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">إجمالي الفاتورة:</h5>
            <h5 class="mb-0 fw-bold"><span id="total-amount">0.000</span> EGP</h5>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-save-fill me-2"></i>حفظ الفاتورة</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
