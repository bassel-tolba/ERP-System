<div class="modal fade" id="viewJournalEntryModal" tabindex="-1" aria-labelledby="viewJournalEntryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewJournalEntryModalLabel">Journal Entry Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>JE-<span id="je-id"></span></strong></p>
                <p><strong>Date:</strong> <span id="je-date"></span></p>
                <p><strong>Description:</strong> <span id="je-description"></span></p>
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th class="text-end">Debit</th>
                            <th class="text-end">Credit</th>
                        </tr>
                    </thead>
                    <tbody id="je-lines-table">
                        <!-- Lines will be injected here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
