<!-- gipcco_project/inventory/templates/inventory/partials/shop_order_template_edit_content.html -->

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0" style="font-weight: 700;">تعديل قالب أمر التشغيل</h1>
    <a href="{% url 'inventory:view_shop_order_template' pk=template.id %}" class="btn btn-outline-secondary">
        <i class="bi bi-x-lg"></i> إلغاء التعديل
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="{% url 'inventory:edit_shop_order_template' pk=template.id %}">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <!-- CHANGE: Added for="id_template_name" -->
                    <label for="id_template_name" class="form-label fw-bold">اسم القالب</label>
                    <!-- CHANGE: Added id="id_template_name" -->
                    <input type="text" class="form-control" name="template_name" id="id_template_name" placeholder="مثال: وصفة جلوكوز 500مل" value="{{ template.name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <!-- CHANGE: Added for="id_final_product" -->
                    <label for="id_final_product" class="form-label fw-bold">المنتج النهائي المرتبط</label>
                    <!-- CHANGE: Added id="id_final_product" -->
                    <select class="form-select searchable-select" name="final_product_id" id="id_final_product" required>
                        <option value="">اختر منتج نهائي...</option>
                        {% for p in final_products %}
                        <option value="{{ p.id }}" {% if p.id == template.final_product.id %}selected{% endif %}>{{ p.name }} ({{ p.code }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <hr>
            <h5 class="mb-3">مواد الوصفة</h5>
            <div id="template-items-container">
                <!-- JS will populate this -->
            </div>
            <button type="button" class="btn btn-outline-success mt-2" id="add-item-btn"><i class="bi bi-plus"></i> إضافة مادة</button>
            
            <div class="mt-4 text-end">
                <a href="{% url 'inventory:view_shop_order_template' pk=template.id %}" class="btn btn-secondary">إلغاء</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> حفظ التعديلات</button>
            </div>
        </form>
    </div>
</div>
