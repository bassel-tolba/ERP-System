<table class="table table-striped table-sm">
    <thead>
        <tr>
            <th>التاريخ والوقت</th>
            <th>المستخدم</th>
            <th>الإجراء</th>
            <th>المبرر</th>
        </tr>
    </thead>
    <tbody>
        {% for log in audit_logs %}
        <tr>
            <td>{{ log.action_timestamp|date:"Y-m-d H:i:s" }}</td>
            <td>{{ log.user.username }}</td>
            <td>
                <span class="badge bg-{% if log.action_type == 'reopen' %}warning text-dark{% elif log.action_type == 'close' %}danger{% else %}secondary{% endif %}">
                    {{ log.get_action_type_display }}
                </span>
            </td>
            <td>{{ log.justification|default:"N/A" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">لا توجد سجلات تدقيق لهذه الفترة.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
