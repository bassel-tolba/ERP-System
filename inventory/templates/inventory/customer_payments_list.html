<!-- gipcco_project/inventory/templates/inventory/customer_payments_list.html -->
{% extends "inventory/layout.html" %}
{% load i18n %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0">{% trans "تحصيلات العملاء" %}</h1>
</div>

<div class="card shadow-sm">
    <div class="card-header">
        <form method="get" class="form-inline">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label for="customer" class="form-label">{% trans "العميل" %}</label>
                    <select name="customer" id="customer" class="form-select searchable-select">
                        <option value="">{% trans "الكل" %}</option>
                        {% for c in customers %}<option value="{{ c.pk }}" {% if c.pk == selected_customer %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-3"><label for="start_date" class="form-label">{% trans "من تاريخ" %}</label><input type="text" name="start_date" id="start_date" class="form-control datepicker" value="{{ start_date|default:'' }}"></div>
                <div class="col-md-3"><label for="end_date" class="form-label">{% trans "إلى تاريخ" %}</label><input type="text" name="end_date" id="end_date" class="form-control datepicker" value="{{ end_date|default:'' }}"></div>
                <div class="col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-primary w-100">{% trans "بحث" %}</button></div>
            </div>
        </form>
    </div>
    <div id="report-content">
        {% include "inventory/partials/customer_payments_list_content.html" %}
    </div>
</div>
{% endblock %}
